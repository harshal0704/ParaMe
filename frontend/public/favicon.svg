<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f5d77f" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Obsidian Background Frame -->
  <rect width="32" height="32" rx="7" fill="#070604" />
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Geometric Kinpaku 'P' Logo Mark -->
  <path d="M 9 7.5 L 18 7.5 C 21.5 7.5 23.5 9.5 23.5 12.5 C 23.5 15.5 21.5 17.5 18 17.5 L 13.5 17.5 L 13.5 24.5 L 9 24.5 Z M 13.5 11.5 L 13.5 13.5 L 17.5 13.5 C 18.8 13.5 19.5 13 19.5 12.5 C 19.5 12 18.8 11.5 17.5 11.5 Z" 
        fill="url(#gold-grad)" 
        filter="url(#glow)" />
</svg>
