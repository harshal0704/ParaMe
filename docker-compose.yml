services:
  db:
    image: pgvector/pgvector:pg16
    container_name: parame_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parame}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_123}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "5432:5432"
    networks:
      - parame_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: parame_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - parame_net

  livekit:
    image: livekit/livekit-server:latest
    container_name: parame_livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - parame_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parame_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_123}@db:5432/${POSTGRES_DB:-parame}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - parame_net

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: parame_voice_agent
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - livekit
      - backend
    networks:
      - parame_net

networks:
  parame_net:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
